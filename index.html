<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechWave </title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .hero {
            background-image: url(./assets/hero-bg.png);
            background-size: cover;
            background-position: center;

        }
    </style>

</head>

<body>
    <!-- Navbar section -->
    <nav>
        <div class="bg-[#412567] flex justify-between p-5 ">
            <h1 class="text-white text-4xl font-bold ml-20">Tech<span
                    class="bg-gradient-to-b from-yellow-500  via-pink-500 via-red-400 to-blue-700 bg-clip-text text-transparent ">Wave</span>
            </h1>
            <ul class="flex text-white gap-9 items-center">
                <li><a href="">About</a></li>
                <li><a href="">Episodes</a></li>
                <li><a href="">Host</a></li>
            </ul>
            <button class="text-white bg-gradient-to-r from-yellow-300 via-pink-500 to-blue-500  rounded-3xl px-5 py-2 mr-20 
               transition-transform duration-300 ease-in-out hover:scale-130">Subscribe<i
                    class="fa-solid fa-arrow-right pl-2 relative top-0.50"></i></button>
        </div>
    </nav>
    <main>
        <!-- hero section -->
        <div class=" hero h-screen ">

            <div class="absolute top-55 left-208 z-10">
                <span class="absolute -inset-2 inline-flex animate-ping rounded-full bg-green-400 opacity-60"></span>
                <button
                    class="relative  px-2  bg-green-400 animate-pulse text-black font-medium rounded-3xl">NEW</button>
            </div>

            <img class="absolute top-50 left-145 w-90" src="./assets/hero-circle.png" alt="">
            <img class="absolute top-73 left-175 w-30" src="./assets/microphone.png" alt="">

            <div class="hero-cont text-center relative top-138 ">
                <h1 class="text-4xl text-white font-bold ">TechWave</h1>
                <p class="text-gray-300 mt-5">Your daily dose of tech insights, productivity hacks, and personal growth
                </p>
                <div class="hero-btn flex justify-center gap-3 mt-5">
                    <button
                        class="text-white bg-gradient-to-r from-purple-600 via-pink-500 to-red-500 rounded-3xl px-5 py-2  "><i
                            class="fa-brands fa-spotify mr-2 animate-pulse"></i>Listen on Spotify</button>

                    <div class="relative">

                        <button class="text-green-500 border-2 rounded-3xl px-5 py-2  animate-bounce"><i
                                class="fa-solid fa-envelope mr-3"></i>Subscribe</button>
                    </div>

                </div>
            </div>
        </div>


    </main>
    <footer>

    </footer>
</body>

</html>
